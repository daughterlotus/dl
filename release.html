<!DOCTYPE html>
<!-- Site developed by Brian M. Dyer-->
<html lang="en">
 <head>
  <link rel="canonical" href="https://daughterlotus.com/music/">
 </head>
 <body>
  <script>
   const params = new URLSearchParams(window.location.search);
   const releaseId = params.get("id");
   if (!releaseId) {
    console.error("No release id provided");
   } else {
    const jsonPath = `music/${releaseId}.json`;

    fetch(jsonPath)
     .then(response => {
      if (!response.ok) {
       throw new Error("Release not found");
      }
      return response.json();
     })
     .then(data => {
      console.log("Release data:", data);
      document.getElementById("release-title").textContent = data.title;
      document.getElementById("release-cover").src = data.coverArt;
     })
     .catch(error => {
      console.error("Release not found");
     });
   }
  </script>
  <h1 id="release-title" style="color:black;"></h1>
  <picture style="max-width:33%;">
   <img id="release-cover">
  </picture>
 </body>
</html>
